name: Notify docs site

# The docs site (gdibble/growther-docs) does NOT read this repository at request
# time. `scripts/build-content.mts` there pulls `docs/` from this repo at BUILD
# time and prerenders every page to static HTML, so a change here is invisible
# until that build runs again. Its deploy workflow accepts a
# `repository_dispatch` of type `docs-updated`; this is the thing that sends it.
#
# WHY THE PATH FILTER IS THE WHOLE POINT
# growther-c5's release.yml pushes into this repository on every version, but it
# stages exactly `dist/c5`, `install.sh`, `install.ps1` and `README.md` — never
# `docs/`. Filtering on `docs/**` therefore means a release never rebuilds the
# docs site, and a documentation edit always does. Without the filter every
# version bump would redeploy the site for no reason.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notify-docs
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask growther-docs to rebuild
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCS_DISPATCH_TOKEN:-}" ]; then
            echo "::error::DOCS_DISPATCH_TOKEN is not set, so the docs site was NOT rebuilt and this change is not live."
            echo "Create a fine-grained PAT scoped to gdibble/growther-docs with Repository permissions > Contents: Read and write (which is what POST /dispatches requires), and add it as the repository secret DOCS_DISPATCH_TOKEN."
            echo "Until then, publish by hand: gh workflow run deploy.yml -R gdibble/growther-docs"
            exit 1
          fi
          # A failure here must be loud. A silent no-op would leave the site
          # showing yesterday's documentation with nothing to say so.
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DOCS_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gdibble/growther-docs/dispatches \
            -d '{"event_type":"docs-updated"}'
          echo "Dispatched docs-updated to gdibble/growther-docs."
